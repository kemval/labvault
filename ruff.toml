# CI lint gate. Starts with ruff's error classes (syntax errors, undefined
# names, unused imports and variables, ambiguous names). Style rules such as
# import sorting are deliberately off to avoid churn. Add BLE001 (blind except)
# once roadmap item 4.3 removes the remaining broad excepts.
target-version = "py311"
extend-exclude = [".venv", "venv"]

[lint]
select = ["E4", "E7", "E9", "F"]
