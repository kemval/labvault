# LabVault requirements: the single source for the requirements specification,
# the risk assessment and the traceability matrix (roadmap 5.5, ADR 0027).
#
# DRAFT, not an executed validation. Edit this file, then regenerate:
#     python scripts/traceability.py           # writes docs/validation/*.md
#     python scripts/traceability.py --check   # CI: fails if stale or untraced
#
# impact      effect on product quality, patient safety or data integrity if the
#             requirement fails: H / M / L
# likelihood  how likely a failure is without the listed controls: H / M / L
# detection   how likely a failure is noticed before harm: H (likely) / M / L
# Risk class (impact x likelihood) and priority (class x detection) follow
# GAMP 5's risk-assessment method; see scripts/traceability.py.
# tests       "file.py::test_name" in tests/; every requirement needs at least one.

[[requirement]]
id = "ACC-01"
area = "Access control"
title = "Each user signs in with a unique account and a password stored only as a salted, slow hash."
regulation = ["21 CFR 11.100(a)", "21 CFR 11.300(a)", "Annex 11 §12.1"]
impact = "H"
likelihood = "M"
detection = "L"
controls = "scrypt with per-password salt; legacy hashes upgraded at sign-in; unparseable hashes never match."
adrs = ["0013"]
tests = [
  "test_auth_security.py::test_hashes_are_salted_and_verify",
  "test_auth_security.py::test_unparseable_hashes_never_match",
  "test_auth_security.py::test_cost_change_triggers_rehash",
  "test_auth_security.py::test_migration_6_wraps_legacy_sha256_hashes",
  "test_auth_security.py::test_legacy_hash_is_upgraded_at_next_sign_in",
  "test_auth_security.py::test_success_returns_user_without_hash",
]

