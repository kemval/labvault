name: Container

# Production image (ADR 0024).
# - Every PR: build the image and run deploy/smoke_test.sh (start, replicate,
#   destroy the container and volume, restore into a new one).
# - main: publish ghcr.io/<owner>/labvault (amd64 + arm64), tagged latest and
#   sha-<commit>; then deploy, if a server is configured.
# - "Run workflow" (or `gh workflow run Container`): the one-command redeploy.
#
# Deploying needs repository variable DEPLOY_ENABLED=true and, in the
# "production" environment, secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
# and DEPLOY_KNOWN_HOSTS (docs/operations/deployment.md). App secrets never
# pass through CI: they stay in deploy/.env on the server.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/labvault

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: labvault:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sh deploy/smoke_test.sh labvault:dev

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false      # never interrupt a deploy halfway
    steps:
      - uses: actions/checkout@v7
      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy sha-${{ github.sha }}
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh_() { ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$TARGET" "$@"; }
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            deploy/compose.yaml deploy/Caddyfile "$TARGET:/opt/labvault/"
          ssh_ "cd /opt/labvault && \
            echo 'LABVAULT_IMAGE=${IMAGE}:sha-${GITHUB_SHA}' > image.env && \
            docker compose --env-file image.env pull labvault && \
            docker compose --env-file image.env up -d --remove-orphans"
          for i in $(seq 1 40); do
            status=$(ssh_ "docker inspect -f '{{.State.Health.Status}}' \$(cd /opt/labvault && docker compose ps -q labvault)")
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          echo "::error::LabVault did not become healthy after the deploy"; exit 1
