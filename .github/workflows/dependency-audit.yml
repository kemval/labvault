name: Dependency audit

# Known-vulnerability gate (ADR 0022). Runs on every change, and weekly so an
# advisory published after a merge is caught without waiting for the next PR.
# GitHub emails the repository owner when a scheduled run fails.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"      # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      # Both locks: what the app deploys with, and the tools CI runs.
      - run: python scripts/audit_deps.py
